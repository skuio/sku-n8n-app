# CI for n8n-nodes-sku-io: lint, build, test on every push and PR.
#
# NOTE: no publishing here on purpose — npm publish is a gated manual action
# (see RUNBOOK.md STOP-gates). Do not add a publish workflow without an
# explicit go-ahead.
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
